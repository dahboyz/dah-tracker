<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dah Tracker - Leaderboards</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,700;0,800;0,900;1,700;1,900&display=swap" rel="stylesheet">
    <style>
        body { 
            background-color: #0b1120; 
            color: #f8fafc; 
            font-family: 'Montserrat', sans-serif; 
        }
        .nt-font {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
        }
        .gold-member {
            color: #fbbf24 !important;
            text-shadow: 0 0 8px rgba(251, 191, 36, 0.3);
        }
        #debug-log { background: #000; color: #00ff66; font-family: monospace; font-size: 11px; max-height: 150px; overflow-y: auto; }
    </style>
</head>
<body class="bg-[#070b14] min-h-screen text-slate-100 selection:bg-sky-500 selection:text-white">

    <header class="bg-[#0b1120] border-b border-slate-800/80 px-6 py-3 flex items-center justify-between sticky top-0 z-50 shadow-md">
        <div class="flex items-center gap-8">
            <div class="flex items-center gap-2 text-xl font-black tracking-wider italic text-sky-400 nt-font">
                <span class="text-white">Dah</span> Tracker <span class="text-emerald-400 text-xs not-italic bg-emerald-950 border border-emerald-800 px-2 py-0.5 rounded-full flex items-center gap-1.5 inline-flex font-normal"><span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>Live</span>
            </div>
            <nav class="hidden md:flex items-center gap-1 text-sm font-semibold">
                <button class="px-4 py-2 rounded-lg bg-sky-500 text-white shadow-sm shadow-sky-500/30">Leaderboards</button>
                <button class="px-4 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800/50 transition">Teams</button>
                <button class="px-4 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800/50 transition">Racers</button>
                <button class="px-4 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800/50 transition flex items-center gap-1.5">
                    Showdown 
                    <span class="bg-rose-500 text-white text-[10px] px-1.5 py-0.2 rounded font-bold uppercase tracking-wider">NEW</span>
                </button>
                <button class="px-4 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800/50 transition">Info</button>
            </nav>
        </div>
        <div>
            <button class="bg-sky-500 hover:bg-sky-400 text-white font-bold px-4 py-1.5 rounded-lg text-sm shadow transition">Login</button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6">

        <div class="flex items-center gap-6 text-sm font-bold border-b border-slate-800/60 pb-3 mb-5 text-slate-400 overflow-x-auto">
            <button onclick="switchMainView('teams')" id="subnav-teams" class="hover:text-white transition pb-3 -mb-[13px]">Team Leaderboards</button>
            <button onclick="switchMainView('individuals')" id="subnav-individuals" class="text-sky-400 font-extrabold border-b-2 border-sky-400 pb-3 -mb-[13px]">Individual Leaderboards</button>
            <button class="hover:text-white transition flex items-center gap-1.5 pb-3 -mb-[13px]">
                Hall of Fame 
                <span class="bg-rose-500 text-white text-[9px] px-1.5 py-0.2 rounded font-bold">NEW</span>
            </button>
            <button class="hover:text-white transition pb-3 -mb-[13px]">Bans</button>
        </div>

        <div id="timeframe-toolbar" class="flex flex-wrap items-center gap-1.5 bg-[#0e1626] p-1.5 rounded-xl border border-slate-800/80 mb-6 shadow-inner text-xs font-bold">
            <button onclick="setTab('60m')" class="time-btn px-3.5 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800/40 transition" id="btn-60m">60 Minute</button>
            <button onclick="setTab('24h')" class="time-btn px-3.5 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800/40 transition" id="btn-24h">24 Hour</button>
            <button onclick="setTab('7d')" class="time-btn px-3.5 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800/40 transition" id="btn-7d">7 Day</button>
            <button onclick="setTab('weekly')" class="time-btn px-3.5 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800/40 transition" id="btn-weekly">Weekly</button>
            <button onclick="setTab('monthly')" class="time-btn px-3.5 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800/40 transition" id="btn-monthly">Monthly</button>
            <button onclick="setTab('yearly')" class="time-btn px-3.5 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800/40 transition" id="btn-yearly">Yearly</button>
            <button onclick="setTab('alltime')" class="time-btn px-3.5 py-2 rounded-lg bg-sky-500 text-white shadow-sm" id="btn-alltime">All-Time</button>
        </div>

        <div class="bg-[#0e1626] border border-slate-800/80 rounded-xl overflow-hidden shadow-xl">
            
            <div class="px-6 py-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-slate-800/80 bg-[#0b1120]/50">
                <h2 id="table-title" class="text-base font-extrabold text-slate-200 nt-font">Individual Leaderboard (All-Time)</h2>
                
                <div class="flex items-center gap-4 w-full sm:w-auto justify-between sm:justify-end">
                    <label id="flagged-filter-container" class="flex items-center gap-2 text-xs text-slate-400 cursor-pointer select-none">
                        <input type="checkbox" class="rounded bg-slate-900 border-slate-700 text-sky-500 focus:ring-0">
                        Show flagged racers
                    </label>
                </div>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr id="table-headers" class="bg-sky-500 text-white font-black text-xs uppercase tracking-wider nt-font">
                            <th class="py-3.5 px-4 w-24">Racer</th>
                            <th class="py-3.5 px-4"></th>
                            <th class="py-3.5 px-4 text-right">Races &#9662;</th>
                            <th class="py-3.5 px-4 text-right">Accuracy &#9662;</th>
                            <th class="py-3.5 px-4 text-right">WPM &#9662;</th>
                            <th class="py-3.5 px-4 text-right">Points &#9662;</th>
                            <th class="py-3.5 px-4 text-right">PPR &#9662;</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-body" class="divide-y divide-slate-800/50 text-slate-300 text-xs font-semibold">
                    </tbody>
                </table>
            </div>
        </div>

        <div class="mt-8 border border-slate-800/80 rounded-xl overflow-hidden bg-[#0e1626]">
            <div class="bg-[#0b1120] px-4 py-2 border-b border-slate-800 flex justify-between items-center text-xs">
                <span class="font-bold uppercase tracking-wider text-amber-400 flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
                    System Debug Log
                </span>
                <button onclick="document.getElementById('debug-log').innerHTML=''" class="text-slate-400 hover:text-white transition">Clear</button>
            </div>
            <div id="debug-log" class="p-3 space-y-1"></div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = "https://cmtmmlhbnfdoydrzhcup.supabase.co"; 
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNtdG1tbGhibmZkb3lkcnpoY3VwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5Njk5MTksImV4cCI6MjEwNDU0NTkxOX0.KpNXm3BNSmtogNFaM3sgerAUxkmnn1LvXds_Gx-svBA";

        const logElement = document.getElementById("debug-log");

        function log(msg, type = "info") {
            const time = new Date().toLocaleTimeString();
            let color = "text-emerald-400";
            if (type === "warn") color = "text-amber-400";
            if (type === "error") color = "text-red-400";
            
            console.log(`[${time}] [${type.toUpperCase()}] ${msg}`);
            if (logElement) {
                logElement.innerHTML += `<div class="${color}">[${time}] ${msg}</div>`;
                logElement.scrollTop = logElement.scrollHeight;
            }
        }

        let db = null;
        try {
            if (window.supabase) {
                db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                log("Supabase client initialized.");
            } else {
                log("Failed to load Supabase SDK!", "error");
            }
        } catch (e) {
            log(`Init error: ${e.message}`, "error");
        }

        let currentView = "individuals";
        let currentTab = "alltime";

        function getTimeframeCutoff(tab) {
            const now = new Date();
            if (tab === '60m') now.setHours(now.getHours() - 1);
            else if (tab === '24h') now.setHours(now.getHours() - 24);
            else if (tab === '7d') now.setDate(now.getDate() - 7);
            else if (tab === 'weekly') now.setDate(now.getDate() - 7);
            else if (tab === 'monthly') now.setDate(now.getDate() - 30);
            else if (tab === 'yearly') now.setFullYear(now.getFullYear() - 1);
            else return null;
            return now;
        }

        function switchMainView(view) {
            currentView = view;
            const btnTeams = document.getElementById("subnav-teams");
            const btnIndiv = document.getElementById("subnav-individuals");
            const toolbar = document.getElementById("timeframe-toolbar");
            const filterContainer = document.getElementById("flagged-filter-container");

            if (view === 'teams') {
                btnTeams.className = "text-sky-400 font-black border-b-2 border-sky-400 pb-3 -mb-[13px]";
                btnIndiv.className = "hover:text-white transition pb-3 -mb-[13px]";
                toolbar.style.display = "none";
                filterContainer.style.display = "none";
                document.getElementById("table-title").innerText = "Team Leaderboard";
                loadTeamLeaderboard();
            } else {
                btnIndiv.className = "text-sky-400 font-black border-b-2 border-sky-400 pb-3 -mb-[13px]";
                btnTeams.className = "hover:text-white transition pb-3 -mb-[13px]";
                toolbar.style.display = "flex";
                filterContainer.style.display = "flex";
                setTab('alltime');
            }
        }

        function setTab(tab) {
            currentTab = tab;
            document.querySelectorAll(".time-btn").forEach(btn => {
                btn.className = "time-btn px-3.5 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800/40 transition";
            });
            const activeBtn = document.getElementById(`btn-${tab}`);
            if (activeBtn) {
                activeBtn.className = "time-btn px-3.5 py-2 rounded-lg bg-sky-500 text-white shadow-sm";
            }
            
            const titles = {
                '60m': 'Individual Leaderboard (Last 60 Minutes)',
                '24h': 'Individual Leaderboard (Last 24 Hours)',
                '7d': 'Individual Leaderboard (Last 7 Days)',
                'weekly': 'Individual Leaderboard (Weekly)',
                'monthly': 'Individual Leaderboard (Monthly)',
                'yearly': 'Individual Leaderboard (Yearly)',
                'alltime': 'Individual Leaderboard (All-Time)'
            };
            
            document.getElementById("table-title").innerText = titles[tab] || 'Individual Leaderboard';
            loadLeaderboard();
        }

        function getRankBadge(index) {
            if (index === 0) return `<div class="w-7 h-7 rounded-full bg-amber-400 text-slate-950 font-black flex items-center justify-center text-xs shadow nt-font">1</div>`;
            if (index === 1) return `<div class="w-7 h-7 rounded-full bg-slate-300 text-slate-950 font-black flex items-center justify-center text-xs shadow nt-font">2</div>`;
            if (index === 2) return `<div class="w-7 h-7 rounded-full bg-amber-700 text-white font-black flex items-center justify-center text-xs shadow nt-font">3</div>`;
            return `<div class="w-7 h-7 rounded-full bg-slate-800 text-slate-400 font-extrabold flex items-center justify-center text-xs nt-font">${index + 1}</div>`;
        }

        async function loadTeamLeaderboard() {
            const tbody = document.getElementById("leaderboard-body");
            const theaders = document.getElementById("table-headers");
            if (!tbody) return;

            theaders.innerHTML = `
                <th class="py-3.5 px-4 w-24">Rank</th>
                <th class="py-3.5 px-4">Team</th>
                <th class="py-3.5 px-4 text-right">Total Races &#9662;</th>
                <th class="py-3.5 px-4 text-right">Avg Accuracy &#9662;</th>
                <th class="py-3.5 px-4 text-right">Avg WPM &#9662;</th>
                <th class="py-3.5 px-4 text-right">Total Points &#9662;</th>
            `;

            tbody.innerHTML = `<tr><td colspan="6" class="p-12 text-center text-slate-500 font-semibold">Loading teams...</td></tr>`;

            if (!db) return;

            try {
                const { data, error } = await db.from('snapshots')
                    .select('*')
                    .eq('type', 'team')
                    .order('captured_at', { ascending: false });

                if (error) throw error;
                if (!data || data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" class="p-12 text-center text-slate-500 font-semibold">No team data found.</td></tr>`;
                    return;
                }

                // STRICT DEDUPLICATION BY TEAM TAG
                const teamMap = new Map();
                data.forEach(item => {
                    const tag = (item.team_tag || item.identifier || "").toUpperCase();
                    if (tag && !teamMap.has(tag)) {
                        teamMap.set(tag, item);
                    }
                });

                const sortedTeams = Array.from(teamMap.values()).sort((a, b) => (b.points || 0) - (a.points || 0));

                tbody.innerHTML = "";
                sortedTeams.forEach((t, index) => {
                    const teamTag = (t.team_tag || t.identifier || "").toUpperCase();
                    const teamUrl = `https://www.nitrotype.com/team/${teamTag}`;

                    tbody.innerHTML += `
                        <tr class="hover:bg-slate-800/30 transition border-b border-slate-800/40">
                            <td class="py-3 px-4 font-bold">${getRankBadge(index)}</td>
                            <td class="py-3 px-4 font-bold text-sky-300 text-sm nt-font">
                                <a href="${teamUrl}" target="_blank" rel="noopener noreferrer" class="hover:underline flex items-center gap-1.5">
                                    [${teamTag}] ${t.title || teamTag}
                                </a>
                            </td>
                            <td class="py-3 px-4 text-right font-mono text-slate-200">${(t.races || 0).toLocaleString()}</td>
                            <td class="py-3 px-4 text-right font-mono text-slate-300">${t.accuracy || 0}%</td>
                            <td class="py-3 px-4 text-right font-mono text-slate-200">${t.wpm || 0}</td>
                            <td class="py-3 px-4 text-right font-mono text-emerald-400 font-bold">${(t.points || 0).toLocaleString()}</td>
                        </tr>
                    `;
                });
            } catch (err) {
                log(`Team error: ${err.message}`, "error");
                tbody.innerHTML = `<tr><td colspan="6" class="p-12 text-center text-red-400 text-xs">Error loading teams: ${err.message}</td></tr>`;
            }
        }

        async function loadLeaderboard() {
            if (currentView !== 'individuals') return;
            
            const tbody = document.getElementById("leaderboard-body");
            const theaders = document.getElementById("table-headers");
            if (!tbody) return;

            theaders.innerHTML = `
                <th class="py-3.5 px-4 w-24">Racer</th>
                <th class="py-3.5 px-4"></th>
                <th class="py-3.5 px-4 text-right">Races &#9662;</th>
                <th class="py-3.5 px-4 text-right">Accuracy &#9662;</th>
                <th class="py-3.5 px-4 text-right">WPM &#9662;</th>
                <th class="py-3.5 px-4 text-right">Points &#9662;</th>
                <th class="py-3.5 px-4 text-right">PPR &#9662;</th>
            `;

            tbody.innerHTML = `<tr><td colspan="7" class="p-12 text-center text-slate-500 font-semibold">Loading racers...</td></tr>`;

            if (!db) return;

            try {
                const { data, error } = await db.from('snapshots')
                    .select('*')
                    .eq('type', 'player')
                    .order('captured_at', { ascending: false });

                if (error) throw error;
                if (!data || data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="7" class="p-12 text-center text-slate-500 font-semibold">No player data found.</td></tr>`;
                    return;
                }

                // Group all snapshots by player identifier
                const histories = new Map();
                data.forEach(item => {
                    const id = (item.identifier || "").toLowerCase();
                    if (!id) return;
                    if (!histories.has(id)) histories.set(id, []);
                    histories.get(id).push(item);
                });

                const cutoffDate = getTimeframeCutoff(currentTab);
                const uniquePlayers = [];

                histories.forEach((snapshots, id) => {
                    // Latest snapshot is guaranteed to be index 0 because of descending query
                    const latest = snapshots[0];

                    let displayRaces = latest.races || 0;
                    let displayPoints = latest.points || 0;

                    if (cutoffDate && currentTab !== 'alltime') {
                        // Find oldest record within cutoff
                        let baseline = snapshots[snapshots.length - 1];
                        for (let s of snapshots) {
                            if (new Date(s.captured_at) <= cutoffDate) {
                                baseline = s;
                                break;
                            }
                        }
                        displayRaces = Math.max(0, (latest.races || 0) - (baseline.races || 0));
                        displayPoints = Math.max(0, (latest.points || 0) - (baseline.points || 0));
                    }

                    uniquePlayers.push({
                        ...latest,
                        display_races: displayRaces,
                        display_points: displayPoints
                    });
                });

                // Sort uniquely deduplicated players
                const sorted = uniquePlayers.sort((a, b) => (b.display_points || 0) - (a.display_points || 0));

                tbody.innerHTML = "";
                sorted.forEach((p, index) => {
                    const racerUrl = `https://www.nitrotype.com/racer/${p.identifier}`;
                    const teamUrl = p.team_tag ? `https://www.nitrotype.com/team/${p.team_tag}` : null;
                    const isGold = p.membership_status === 'gold';
                    const nameColorClass = isGold ? 'gold-member font-black' : 'text-sky-300 font-bold';
                    const carImage = p.car_img_url || 'https://www.nitrotype.com/cars/1_large_1.png';

                    tbody.innerHTML += `
                        <tr class="hover:bg-slate-800/30 transition border-b border-slate-800/40">
                            <td class="py-3 px-4 font-bold">${getRankBadge(index)}</td>
                            <td class="py-3 px-4">
                                <div class="flex items-center gap-3">
                                    <div class="w-12 h-8 bg-slate-900/80 rounded border border-slate-700/60 flex items-center justify-center overflow-hidden shrink-0">
                                        <img src="${carImage}" alt="car" class="max-h-full object-contain" onerror="this.onerror=null; this.src='https://www.nitrotype.com/cars/1_large_1.png';"/>
                                    </div>
                                    <div>
                                        <div class="text-sm flex items-center gap-1.5 nt-font">
                                            ${teamUrl ? `<a href="${teamUrl}" target="_blank" rel="noopener noreferrer" class="text-slate-400 hover:text-white transition text-xs font-bold">[${p.team_tag}]</a>` : ''}
                                            <a href="${racerUrl}" target="_blank" rel="noopener noreferrer" class="${nameColorClass} hover:underline">
                                                ${p.title || p.identifier || 'Unknown Racer'}
                                            </a>
                                        </div>
                                        <div class="text-[11px] text-slate-500 italic font-normal">${p.identifier || ''}</div>
                                    </div>
                                </div>
                            </td>
                            <td class="py-3 px-4 text-right font-mono text-slate-200">${(p.display_races || 0).toLocaleString()}</td>
                            <td class="py-3 px-4 text-right font-mono text-slate-300">${p.accuracy || 0}%</td>
                            <td class="py-3 px-4 text-right font-mono text-slate-200">${p.wpm || 0}</td>
                            <td class="py-3 px-4 text-right font-mono text-emerald-400 font-bold">${(p.display_points || 0).toLocaleString()}</td>
                            <td class="py-3 px-4 text-right font-mono text-slate-300">${p.ppr || 0}</td>
                        </tr>
                    `;
                });

            } catch (err) {
                log(`Racer error: ${err.message}`, "error");
                tbody.innerHTML = `<tr><td colspan="7" class="p-12 text-center text-red-400 font-mono text-xs">Error: ${err.message}</td></tr>`;
            }
        }

        loadLeaderboard();

        setInterval(() => {
            if (currentView === 'teams') {
                loadTeamLeaderboard();
            } else {
                loadLeaderboard();
            }
        }, 30000);
    </script>
</body>
</html>
