<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dah Tracker - Leaderboards</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b1120; color: #f8fafc; font-family: sans-serif; }
        #debug-log { background: #000; color: #00ff66; font-family: monospace; font-size: 11px; max-height: 200px; overflow-y: auto; }
    </style>
</head>
<body class="p-6">

    <div class="max-w-6xl mx-auto">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold text-sky-400">Dah Tracker</h1>
            <span class="bg-emerald-950 text-emerald-400 border border-emerald-800 text-xs px-3 py-1 rounded-full flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                Live Sync Active
            </span>
        </div>

        <!-- Timeframe Navigation -->
        <div class="flex gap-2 mb-4 text-sm font-semibold border-b border-slate-800 pb-2">
            <button onclick="setTab('60m')" class="tab-btn px-3 py-1.5 rounded bg-sky-500 text-white" id="btn-60m">60 Minute</button>
            <button onclick="setTab('24h')" class="tab-btn px-3 py-1.5 rounded text-slate-400 hover:text-white" id="btn-24h">24 Hour</button>
            <button onclick="setTab('alltime')" class="tab-btn px-3 py-1.5 rounded text-slate-400 hover:text-white" id="btn-alltime">All-Time</button>
        </div>

        <!-- Leaderboard Table -->
        <div class="bg-slate-900 border border-slate-800 rounded-lg overflow-hidden">
            <table class="w-full text-left border-collapse text-sm">
                <thead>
                    <tr class="bg-slate-950 text-slate-400 border-b border-slate-800">
                        <th class="p-3">Rank</th>
                        <th class="p-3">Racer</th>
                        <th class="p-3">Races</th>
                        <th class="p-3">WPM</th>
                        <th class="p-3">Accuracy</th>
                        <th class="p-3">Points</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body">
                    <tr>
                        <td colspan="6" class="p-8 text-center text-slate-500">Initializing...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- On-Screen Debugger -->
        <div class="mt-8 border border-slate-800 rounded-lg overflow-hidden">
            <div class="bg-slate-950 px-4 py-2 border-b border-slate-800 flex justify-between items-center text-xs text-slate-400">
                <span class="font-bold uppercase tracking-wider text-amber-400">System Debug Log</span>
                <button onclick="document.getElementById('debug-log').innerHTML=''" class="hover:text-white">Clear</button>
            </div>
            <div id="debug-log" class="p-4 space-y-1"></div>
        </div>
    </div>

    <script>
        // SUPABASE CREDENTIALS
        const SUPABASE_URL = "https://cmtmmlhbnfdoydrzhcup.supabase.co"; 
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNtdG1tbGhibmZkb3lkcnpoY3VwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5Njk5MTksImV4cCI6MjEwNDU0NTkxOX0.KpNXm3BNSmtogNFaM3sgerAUxkmnn1LvXds_Gx-svBA";

        const logElement = document.getElementById("debug-log");

        function log(msg, type = "info") {
            const time = new Date().toLocaleTimeString();
            let color = "text-emerald-400";
            if (type === "warn") color = "text-amber-400";
            if (type === "error") color = "text-red-400";
            
            console.log(`[${time}] [${type.toUpperCase()}] ${msg}`);
            logElement.innerHTML += `<div class="${color}">[${time}] ${msg}</div>`;
            logElement.scrollTop = logElement.scrollHeight;
        }

        let db = null;
        try {
            if (window.supabase) {
                db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                log("Supabase client initialized.");
            } else {
                log("Failed to load Supabase JS SDK library!", "error");
            }
        } catch (e) {
            log(`Client init exception: ${e.message}`, "error");
        }

        let currentTab = "60m";

        function setTab(tab) {
            currentTab = tab;
            document.querySelectorAll(".tab-btn").forEach(btn => {
                btn.className = "tab-btn px-3 py-1.5 rounded text-slate-400 hover:text-white";
            });
            document.getElementById(`btn-${tab}`).className = "tab-btn px-3 py-1.5 rounded bg-sky-500 text-white";
            log(`Switched tab to: ${tab}`);
            loadLeaderboard();
        }

        async function loadLeaderboard() {
            const tbody = document.getElementById("leaderboard-body");
            tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-slate-500">Querying database...</td></tr>`;

            if (!db) {
                log("Cannot query: Supabase client is missing credentials.", "error");
                tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-red-400 font-mono text-xs">Database configuration error. Check debug log below.</td></tr>`;
                return;
            }

            log(`Executing query for timeframe: ${currentTab}...`);

            try {
                let query = db.from('player_leaderboard_deltas').select('*');

                if (currentTab === '60m') {
                    query = query.order('points_60m', { ascending: false }).limit(50);
                } else if (currentTab === '24h') {
                    query = query.order('points_24h', { ascending: false }).limit(50);
                } else {
                    query = query.order('alltime_points', { ascending: false }).limit(50);
                }

                const { data, error } = await query;

                if (error) {
                    log(`Database Query Error: ${error.message} (Code: ${error.code})`, "error");
                    tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-red-400 font-mono text-xs">Query error: ${error.message}</td></tr>`;
                    return;
                }

                log(`Query returned ${data ? data.length : 0} rows.`);

                if (!data || data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-slate-500">No records found for this timeframe yet. Let the 5-min scraper run!</td></tr>`;
                    return;
                }

                tbody.innerHTML = "";
                data.forEach((p, index) => {
                    const displayRaces = currentTab === '60m' ? p.races_60m : (currentTab === '24h' ? p.races_24h : p.alltime_races);
                    const displayPoints = currentTab === '60m' ? p.points_60m : (currentTab === '24h' ? p.points_24h : p.alltime_points);

                    tbody.innerHTML += `
                        <tr class="border-b border-slate-800/50 hover:bg-slate-800/30">
                            <td class="p-3 font-bold text-slate-400">#${index + 1}</td>
                            <td class="p-3">
                                <div class="font-semibold text-sky-300">${p.identifier}</div>
                                <div class="text-xs text-slate-500">${p.team_tag ? '[' + p.team_tag + ']' : ''}</div>
                            </td>
                            <td class="p-3 font-mono">${displayRaces}</td>
                            <td class="p-3 font-mono">${p.wpm || 0}</td>
                            <td class="p-3 font-mono">${p.accuracy || 0}%</td>
                            <td class="p-3 font-mono text-emerald-400">${displayPoints}</td>
                        </tr>
                    `;
                });

            } catch (err) {
                log(`JavaScript runtime exception: ${err.message}`, "error");
            }
        }

        // Initial fetch
        loadLeaderboard();
    </script>
</body>
</html>
